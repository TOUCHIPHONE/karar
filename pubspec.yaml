name: karar_app
description: >-
  A Flutter application for managing work wages and expenses with Firebase integration.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_core: ^3.4.1
  provider: ^6.1.2
  intl: ^0.19.0
  printing: ^5.13.4
  pdf: ^3.10.7
  collection: ^1.18.0
  equatable: ^2.0.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
